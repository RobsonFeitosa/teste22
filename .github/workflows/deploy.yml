name: Deploy via SSH (RAW)

on:
  push:
    branches:
      - main

env: 
  SSH_HOST: "base1.easychannel.online"     
  SSH_USER: "root"           
  SSH_PORT: "232"               

  SSH_PRIVATE_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
     
    -----END OPENSSH PRIVATE KEY-----

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Salvar chave SSH em arquivo
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -l ~/.ssh

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VM via SSH
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /var/www && git pull origin development"