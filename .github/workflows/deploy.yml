name: Deploy Direto EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar arquivos via SSH (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/meu-app"

      - name: Executar comandos remotos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Garante que o shell use o Node 20 instalado via NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20

            cd /home/ubuntu/meu-app
            
            # 1. Limpeza para evitar o erro de conflito de lockfiles que vimos no log
            rm -f package-lock.json
            rm -rf dist node_modules
            
            # 2. Instalação (o Nest 11 exige Node 20+)
            yarn install
            
            # 3. Build usando o compilador SWC configurado no seu package.json
            yarn build
            
            # 4. Gerenciamento do processo
            # O start:prod do seu package.json aponta para node dist/main
            pm2 restart boilerplate || pm2 start dist/main.js --name boilerplate
            pm2 save

